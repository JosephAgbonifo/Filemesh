[package]
name = "filemesh-rs"
version = "0.2.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# Libp2p for P2P networking
libp2p = { version = "0.53", features = [
    "tcp",
    "dns",
    "noise",
    "yamux",
    "gossipsub",
    "mdns",
    "identify",
    "ping",
    "relay",
    "dcutr",
    "autonat",
    "request-response",
    "macros",
    "tokio",
] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Wire format + hashing
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_bytes = "0.11"
blake3 = "1"
hex = "0.4"

# Terminal output
indicatif = "0.17"
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
